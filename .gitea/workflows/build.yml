name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  package-and-deploy:
    uses: Public-Actions/docker-build-and-publish/.gitea/workflows/build.yml@release/1.0.1
    secrets: inherit
    with:
      docker_org: ${{ secrets.DR_REGISTRY }}/git-sync
      build_context: ./
      build_file: ./src/docker/Dockerfile
