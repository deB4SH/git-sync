name: build

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ${{ secrets.DR_DOCKERIO_PULL_PROXY }}/catthehacker/ubuntu:act-latest
    env:
      DOCKER_ORG: ${{ secrets.DR_REGISTRY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all history for all branches and tags
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v3
      - name: Get Meta
        id: meta
        run: |
          echo REPO_NAME=$(echo ${GITHUB_REPOSITORY} | awk -F"/" '{print tolower($2)}') >> $GITHUB_OUTPUT
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo SHA_SHORT=${GITHUB_REF_NAME} >> $GITHUB_OUTPUT
          else
            echo SHA_SHORT=$(git rev-parse --short HEAD) >> $GITHUB_OUTPUT
          fi
      - name: Login
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.DR_REGISTRY }}
          username: ${{ secrets.DR_USER }}
          password: ${{ secrets.DR_PASSWORD }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./Dockerfile
          platforms: |
            linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_ORG }}/${{ steps.meta.outputs.REPO_NAME }}:${{ steps.meta.outputs.SHA_SHORT }}
